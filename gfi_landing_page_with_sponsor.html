
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Financial Impact</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom right, #002f6c, #0072ce);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    p {
      font-size: 1em;
      margin-bottom: 30px;
    }
    .button {
      background-color: #0072ce;
      color: white;
      border: none;
      padding: 15px;
      margin: 10px 0;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .button:hover {
      background-color: #005fa3;
    }
    .section {
      background-color: rgba(255, 255, 255, 0.1);
      margin-top: 30px;
      border-radius: 8px;
      padding: 20px;
    }
    .quote {
      font-style: italic;
      margin-top: 30px;
    }
    .social-icons {
      margin-top: 20px;
    }
    .social-icons img {
      width: 30px;
      margin: 0 10px;
    }
    .sponsor-photo {
      margin-top: 20px;
    }
    .sponsor-photo img {
      width: 150px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo_placeholder.png" alt="Global Financial Impact Logo" width="80" />
    <div class="sponsor-photo">
      <img src="deb_crop_pic.jpg" alt="Sponsor Photo" />
      <p><strong>Sponsored by Jane Doe</strong></p>
    </div>
    <h1>Solving Your Financial Problems</h1>
    <p>Empowering you with solutions to manage, reduce, and eliminate financial challenges.</p>

    <button class="button" onclick="window.location.href='https://calendly.com/yourlink'">Schedule a Call</button>
    <button class="button" onclick="window.location.href='https://yourvideochannel.com'">Watch Our Videos</button>
    <button class="button" onclick="window.location.href='https://youreventlink.com'">Join Our Webinar</button>

    <div class="section">
      <p><strong>Debt Relief</strong></p>
      <p><strong>Budgeting Strategies</strong></p>
      <p><strong>Investment Guidance</strong></p>
    </div>

    <div class="quote">
      <p>"The advice I received transformed my approach to finances."</p>
      <p>- John D.</p>
    </div>

    <div class="social-icons">
      <a href="https://facebook.com"><img src="facebook_icon.png" alt="Facebook"></a>
      <a href="https://instagram.com"><img src="instagram_icon.png" alt="Instagram"></a>
      <a href="https://twitter.com"><img src="twitter_icon.png" alt="Twitter"></a>
      <a href="https://linkedin.com"><img src="linkedin_icon.png" alt="LinkedIn"></a>
    </div>
  </div>
</body>
</html>
